# Codecov configuration.
#
# Coverage measures the unit-tested business logic: config, changelog source
# resolution/fetching, reference parsing, store, and updater. The remaining
# packages are Docker/HTTP I/O glue (dockerx, agent, server) that is exercised
# by smoke/integration testing, plus the entrypoint (cmd) and embedded-asset
# (webui) packages which have no meaningful branches to unit test.
coverage:
  status:
    project:
      default:
        target: 20%      # fail if overall coverage falls below 20%
    patch:
      default:
        target: auto     # new patches must not reduce coverage
