<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>WhatsNewDock</title>
    <!--
      Inter and JetBrains Mono are loaded from Google Fonts. The server's
      Content-Security-Policy allows exactly these two origins for stylesheets
      and fonts respectively (see securityHeaders in internal/server/middleware.go)
      and nothing else from a third party. To avoid the external request, self-host
      the woff2 files under web/public/fonts and replace these tags with
      @font-face rules in src/index.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
