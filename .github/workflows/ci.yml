name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests & security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Static security analysis (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude=G104 ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Allowlist: GO-2026-4887 & GO-2026-4883 are Moby daemon-side AuthZ /
          # legacy-plugin issues with no upstream fix. WhatsNewDock only uses the
          # Docker Engine API *client* SDK and never runs the daemon's plugin
          # subsystems, so they are not reachable here. See docs/SECURITY.md.
          set +e
          govulncheck ./... > /tmp/govulncheck.txt 2>&1
          code=$?
          set -e
          cat /tmp/govulncheck.txt
          if [ "$code" -ne 0 ]; then
            remaining=$(grep -oE 'GO-[0-9]{4}-[0-9]+' /tmp/govulncheck.txt | sort -u | grep -v -E '^(GO-2026-4887|GO-2026-4883)$' || true)
            if [ -n "$remaining" ]; then
              echo "::error::govulncheck found vulnerabilities: $(echo "$remaining" | tr '\n' ' ')"
              exit 1
            fi
            echo "::warning::govulncheck reported only allowlisted, non-exploitable Moby daemon-side advisories"
          fi

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high
